<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Candlestick chart grid & bars in background -->
  <rect x="120" y="240" width="16" height="120" rx="4" fill="#3b82f6" fill-opacity="0.3"/>
  <line x1="128" y1="210" x2="128" y2="390" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.3"/>

  <rect x="180" y="200" width="16" height="100" rx="4" fill="#10b981" fill-opacity="0.3"/>
  <line x1="188" y1="180" x2="188" y2="330" stroke="#10b981" stroke-width="3" stroke-opacity="0.3"/>

  <rect x="240" y="160" width="16" height="130" rx="4" fill="#06b6d4" fill-opacity="0.3"/>
  <line x1="248" y1="130" x2="248" y2="310" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Trending upwards dynamic curve -->
  <path d="M 80 380 Q 180 360 260 260 T 430 130" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Bullish Arrow head -->
  <polygon points="430,110 445,155 400,140" fill="#10b981" filter="url(#glow)"/>

  <!-- Glowing trophy icon or point emblem -->
  <circle cx="420" cy="130" r="14" fill="#38bdf8"/>
  <circle cx="420" cy="130" r="28" fill="#38bdf8" fill-opacity="0.25"/>

  <!-- Brand Text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">TRADEARENA</text>
</svg>
